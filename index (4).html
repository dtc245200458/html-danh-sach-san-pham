<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            color: #222;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 650px;
        }
        th, td {
            border: 1px solid #888;
            padding: 10px 12px;
            text-align: left;
        }
        th {
            background-color: #e8f1fa;
        }
    </style>
</head>
<body>
    <h1>Danh sách sản phẩm</h1>
    <table>
        <thead>
            <tr>
                <th scope="col">Tên sản phẩm</th>
                <th scope="col">Giá</th>
                <th scope="col">Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Bút bi</td>
                <td>5.000 đồng</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Vở ô ly</td>
                <td>12.000 đồng</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Thước kẻ</td>
                <td>8.000 đồng</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Hộp bút</td>
                <td>35.000 đồng</td>
                <td>8</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
